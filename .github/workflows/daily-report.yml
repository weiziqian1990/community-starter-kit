name: Daily AI Leaders Report

on:
  schedule:
    # Runs at 9:00 AM Beijing Time (01:00 UTC) every day
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate daily report
        run: |
          node scripts/generate-report.js --save

      - name: Generate Notion table
        run: |
          node scripts/format-notion-table.js > notion-table.md

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Commit and push report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add reports/ notion-table.md
          git diff --staged --quiet || git commit -m "Daily report: ${{ steps.date.outputs.date }}"
          git push

      - name: Create Issue for Daily Report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toLocaleDateString('zh-CN', {
              year: 'numeric',
              month: 'long',
              day: 'numeric',
              weekday: 'long'
            });

            const reportPath = `reports/report-${{ steps.date.outputs.date }}.md`;
            let reportContent = '报告生成中...';

            try {
              reportContent = fs.readFileSync(reportPath, 'utf8');
            } catch (error) {
              console.log('Report file not found, generating inline...');
              // Fallback: generate report inline
              const { execSync } = require('child_process');
              reportContent = execSync('node scripts/generate-report.js').toString();
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🌅 AI领袖日报 - ${date}`,
              body: reportContent,
              labels: ['daily-report', 'ai-leaders']
            });

      - name: Send notification (optional)
        run: |
          echo "📧 Daily report generated and pushed!"
          echo "📊 Report available at: reports/report-${{ steps.date.outputs.date }}.md"
          echo "📋 Notion table updated: notion-table.md"
          # Add your notification logic here (email, Slack, Discord, etc.)
          # Example for email (requires setup):
          # curl -X POST https://api.your-email-service.com/send \
          #   -d "to=${{ secrets.NOTIFICATION_EMAIL }}" \
          #   -d "subject=AI Leaders Daily Report" \
          #   -d "body=New report available"
