name: Update AI Leaders Data

on:
  push:
    paths:
      - 'data/ai-leaders.json'
  workflow_dispatch:

jobs:
  validate-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Validate JSON structure
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('data/ai-leaders.json', 'utf8'));
            console.log('✅ JSON is valid');
            console.log('📊 Total leaders:', data.leaders.length);
            console.log('🕐 Last updated:', data.lastUpdated);
          "

      - name: Update Notion table
        run: |
          node scripts/format-notion-table.js > notion-table.md

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add notion-table.md
          git diff --staged --quiet || git commit -m "Update Notion table after data change"
          git push || echo "No changes to push"

      - name: Comment on commit
        uses: actions/github-script@v7
        if: github.event_name == 'push'
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('data/ai-leaders.json', 'utf8'));

            const stats = {
              total: data.leaders.length,
              founders: data.leaders.filter(l => l.category === 'founder').length,
              executives: data.leaders.filter(l => l.category === 'executive').length,
              entrepreneurs: data.leaders.filter(l => l.category === 'entrepreneur').length,
              researchers: data.leaders.filter(l => l.category === 'researcher').length,
              product_leaders: data.leaders.filter(l => l.category === 'product_leader').length,
              withInterviews: data.leaders.filter(l => l.interviews && l.interviews.length > 0).length
            };

            const message = `## 📊 AI Leaders Database Updated

**Current Stats:**
- Total Leaders: **${stats.total}**
- Founders: ${stats.founders}
- Executives: ${stats.executives}
- Entrepreneurs: ${stats.entrepreneurs}
- Researchers: ${stats.researchers}
- Product Leaders: ${stats.product_leaders}
- With Interviews: ${stats.withInterviews}

Last Updated: ${data.lastUpdated}

✅ Notion table has been regenerated.`;

            // Post as commit comment
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: message
            });
